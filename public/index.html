<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한진 2026 신입사원 프리보딩</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <h1>한진 2026 신입사원 프리보딩</h1>
            </div>
            <nav>
                <button class="nav-btn active" data-section="guestbook">방명록</button>
                <button class="nav-btn" data-section="introductions">자기소개</button>
                <button class="nav-btn" data-section="notices">공지사항</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- 방명록 섹션 -->
        <section id="guestbook" class="section active">
            <h2>방명록</h2>
            <div class="write-form">
                <input type="text" id="guestbook-name" placeholder="이름" required>
                <textarea id="guestbook-message" placeholder="메시지를 입력하세요..." required></textarea>
                <div class="file-input-wrapper">
                    <label for="guestbook-images" class="file-label">
                        📷 이미지 선택 (최대 5장)
                    </label>
                    <input type="file" id="guestbook-images" accept="image/*" multiple>
                    <div id="guestbook-preview" class="image-preview"></div>
                </div>
                <button onclick="submitGuestbook()" class="submit-btn">작성하기</button>
            </div>
            <div id="guestbook-list" class="posts-list"></div>
        </section>

        <!-- 자기소개 섹션 -->
        <section id="introductions" class="section">
            <h2>자기소개</h2>
            <div class="write-form">
                <input type="text" id="intro-name" placeholder="이름" required>
                <input type="text" id="intro-department" placeholder="부서 (선택사항)">
                <textarea id="intro-content" placeholder="자기소개를 입력하세요..." required></textarea>
                <div class="file-input-wrapper">
                    <label for="intro-images" class="file-label">
                        📷 이미지 선택 (최대 5장)
                    </label>
                    <input type="file" id="intro-images" accept="image/*" multiple>
                    <div id="intro-preview" class="image-preview"></div>
                </div>
                <button onclick="submitIntroduction()" class="submit-btn">작성하기</button>
            </div>
            <div id="introductions-list" class="posts-list"></div>
        </section>

        <!-- 공지사항 섹션 -->
        <section id="notices" class="section">
            <h2>공지사항</h2>
            <div class="write-form">
                <input type="text" id="notice-title" placeholder="제목" required>
                <textarea id="notice-content" placeholder="공지사항 내용을 입력하세요..." required></textarea>
                <input type="text" id="notice-author" placeholder="작성자" required>
                <button onclick="submitNotice()" class="submit-btn">작성하기</button>
            </div>
            <div id="notices-list" class="posts-list"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 한진 신입사원 프리보딩. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
